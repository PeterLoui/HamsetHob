name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # يولّد ملفات أندرويد الناقصة فقط (Gradle والأيقونات) دون أن يلمس ملفاتنا
      - name: Generate Android scaffolding
        run: flutter create --platforms=android --org com.hamsethob --project-name hamset_hob .

      # الويدجتس والإشعارات تحتاج أندرويد 8 (API 26) على الأقل
      - name: Set minSdk 26
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 26/' "$f"
            grep -n "minSdk" "$f"
          done

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hamset-hob-flutter
          path: build/app/outputs/flutter-apk/app-release.apk
